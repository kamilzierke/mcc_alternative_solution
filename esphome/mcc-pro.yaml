# MCC Pro ESPHome temperature readout skeleton
# Full working YAML should keep the same logic:
# - PCF8574 0x27 P0 low enables U10
# - GPIO13/12/14/16 select U10 Y0..Y15
# - A0 is averaged and converted with ADC full-scale 3.02 V

substitutions:
  device_name: mcc-pro
  tc1047_adc_full_scale_v: "3.02"

esphome:
  name: ${device_name}

esp8266:
  board: esp12e

logger:
  level: DEBUG

api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true
  frequency: 50000Hz

# NOTE: this file is intentionally reduced for repository documentation.
# Use local tested YAML from the project archive for flashing until this is expanded.
