[platformio]
default_envs = mcc_pro_readonly

[env:mcc_pro_readonly]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
build_flags =
  -I../shared
  -DMCC_FIRMWARE_VERSION=\"0.1.0-diagnostic.1\"
  -DMCC_READ_ONLY=1
  -DMCC_TC1047_ADC_FULL_SCALE_V=3.02f
  -DMCC_TC1047_TEMP_OFFSET_C=0.0f
  -DMCC_INA219_INTERNAL_SHUNT_MOHM=60.0f
  -DMCC_INA219_EXTERNAL_SHUNT_MOHM=60.0f