name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify public repository hygiene
        shell: pwsh
        run: .\scripts\verify-repository.ps1

      - name: Run UART frame buffer test
        shell: pwsh
        run: .\tests\test_mcc_uart_frame_buffer.ps1

  diagnostic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build and run diagnostic contract tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I shared tests/test_mcc_diag_contract.cpp -o /tmp/test_mcc_diag_contract
          /tmp/test_mcc_diag_contract
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/include tests/test_mcc_firmware_core.cpp -o /tmp/test_mcc_firmware_core
          /tmp/test_mcc_firmware_core
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/include tests/test_mcc_i2c_probe_plan.cpp -o /tmp/test_mcc_i2c_probe_plan
          /tmp/test_mcc_i2c_probe_plan
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/include tests/test_mcc_bq_probe_plan.cpp -o /tmp/test_mcc_bq_probe_plan
          /tmp/test_mcc_bq_probe_plan