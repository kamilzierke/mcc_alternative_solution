type: sections
max_columns: 4
title: MCC
path: mcc
sections:
  - type: grid
    cards:
      - type: heading
        heading: C1 - C8
        heading_style: title
      - type: custom:mushroom-template-card
        entity: sensor.mcc_pro_c1_internal_ina219_bus_voltage
        primary: C1
        secondary: >
          {% set t =
          states('sensor.mcc_pro_tc1047_temperature_diagnostic_c1_tc1047_temperature')
          %}

          {% set u = states('sensor.mcc_pro_c1_internal_ina219_bus_voltage') %}

          {% set i = states('sensor.mcc_pro_c1_internal_ina219_current') %}

          {% set sh = states('sensor.mcc_pro_c1_internal_ina219_shunt_voltage')
          %}

          T: {{ (t | float | round(2)) if is_number(t) else t }} {{
          state_attr('sensor.mcc_pro_tc1047_temperature_diagnostic_c1_tc1047_temperature',
          'unit_of_measurement') or '' }}

          U: {{ (u | float | round(2)) if is_number(u) else u }} {{
          state_attr('sensor.mcc_pro_c1_internal_ina219_bus_voltage',
          'unit_of_measurement') or '' }}

          I: {{ (i | float | round(2)) if is_number(i) else i }} {{
          state_attr('sensor.mcc_pro_c1_internal_ina219_current',
          'unit_of_measurement') or '' }}

          Sh: {{ (sh | float | round(2)) if is_number(sh) else sh }} {{
          state_attr('sensor.mcc_pro_c1_internal_ina219_shunt_voltage',
          'unit_of_measurement') or '' }}
        icon: mdi:battery
        icon_color: >-
          {% set t =
          states('sensor.mcc_pro_tc1047_temperature_diagnostic_c1_tc1047_temperature')
          %} {% if t in ['unknown', 'unavailable', 'none'] %}
            grey
          {% elif t | float > 50 %}
            red
          {% elif t | float > 40 %}
            orange
          {% elif t | float < 5 %}
            blue
          {% else %}
            green
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
        card_mod:
          style: |
            ha-card {
              border-radius: 18px;
              border-left: 5px solid var(--green-color);
            }
