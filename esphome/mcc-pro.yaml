substitutions:
  device_name: mcc-pro
  friendly_name: MCC Pro
  tc1047_adc_full_scale_v: "3.02"
  tc1047_temp_offset_c: "0.0"
  # Calibration rule:
  # tc1047_adc_full_scale_v = V_multimeter_at_mux_Z_or_TC1047_VOUT * 1023 / raw_avg
  # Current value 3.02 comes from: ESPHome 0.8761V vs multimeter 0.801V, after prior 3.30V assumption.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "MegaCell Charger Pro: on-demand per-slot TC1047 + BQ24195 diagnostics through mux/TCA."
  includes:
    - mcc_diag_helpers_slot_queue.h
  platformio_options:
    build_flags:
      - -DMCC_TC1047_ADC_FULL_SCALE_V=${tc1047_adc_full_scale_v}f
      - -DMCC_TC1047_TEMP_OFFSET_C=${tc1047_temp_offset_c}f
  on_boot:
    priority: 600
    then:
      - lambda: |-
          mccdiag::init_pins();
          mccdiag::disable_tcas();
          mccdiag::setup_bq_web_handler();
          ESP_LOGW("mcc_boot", "MCC TC1047 all-slot diagnostic booted. Temp mux enable: PCF8574 P0 LOW. Mux channels Y0..Y15 map to C1..C16. ADC full-scale %.3fV.", ${tc1047_adc_full_scale_v}f);

esp8266:
  board: esp12e
  restore_from_flash: false

logger:
  level: INFO
  baud_rate: 115200

wifi:
  id: mcc_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  min_auth_mode: WPA2

captive_portal:

api:
  id: api_server
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  port: 80
  version: 3
  include_internal: true

# I2C observed on MCC Pro ESP8266 board.
# Expected boot scan: 0x27, 0x3C, 0x41, 0x4F, 0x70, 0x71.
# New trace: INA219 U47=0x41; U34=0x45 if visible on the selected bus/path.
i2c:
  sda: GPIO4
  scl: GPIO5
  # Keep boot light: enable only during hardware bring-up diagnostics.
  scan: false
  frequency: 50000Hz
  timeout: 100ms

globals:
  - id: oled_page
    type: int
    restore_value: false
    initial_value: "0"

  - id: boot_services_ready
    type: bool
    restore_value: false
    initial_value: "false"

interval:
  - interval: 250ms
    startup_delay: 10s
    then:
      - lambda: |-
          mccdiag::process_bq_web_read_request();

  - interval: 2s
    startup_delay: 10s
    then:
      - lambda: |-
          if (!id(boot_services_ready) && id(mcc_wifi).is_connected() && id(api_server).is_connected()) {
            id(boot_services_ready) = true;
            ESP_LOGW("mcc_boot", "WiFi and API are connected; enabling OLED updates and on-demand slot reads.");
          }

  - interval: 5s
    startup_delay: 30s
    then:
      - if:
          condition:
            lambda: |-
              return id(boot_services_ready);
          then:
            - lambda: |-
                id(oled_page) = (id(oled_page) + 1) % 3;
            - component.update: oled_display

