substitutions:
  device_name: mcc-pro
  friendly_name: MCC Pro 
  tc1047_adc_full_scale_v: "3.02"
  tc1047_temp_offset_c: "0.0"
  tc1047_scan_interval: "10s"
  # Calibration rule:
  # tc1047_adc_full_scale_v = V_multimeter_at_mux_Z_or_TC1047_VOUT * 1023 / raw_avg
  # Current value 3.02 comes from: ESPHome 0.8761V vs multimeter 0.801V, after prior 3.30V assumption.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "MegaCell Charger Pro: sequential TC1047 temperature scan C1..C16 through 74HC4067, enabled by PCF8574 P0. Diagnostics retained."
  includes:
    - mcc_diag_helpers.h
  on_boot:
    priority: 600
    then:
      - lambda: |-
          mccdiag::init_pins();
          mccdiag::disable_tcas();
          ESP_LOGW("mcc_boot", "MCC TC1047 all-slot diagnostic booted. Temp mux enable: PCF8574 P0 LOW. Mux channels Y0..Y15 map to C1..C16. ADC full-scale %.3fV.", ${tc1047_adc_full_scale_v}f);

esp8266:
  board: esp12e
  restore_from_flash: false

logger:
  level: INFO
  baud_rate: 115200

wifi:
  id: mcc_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  min_auth_mode: WPA2

captive_portal:

api:
  id: api_server
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  port: 80
  version: 3
  include_internal: true

# I2C observed on MCC Pro ESP8266 board.
# Expected boot scan: 0x27, 0x3C, 0x41, 0x4F, 0x70, 0x71.
i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true
  frequency: 50000Hz
  timeout: 1s

globals:
  - id: oled_page
    type: int
    restore_value: false
    initial_value: "0"

script:
  - id: scan_all_tc1047_temperatures
    mode: single
    then:
      - lambda: |-
          static const char *TAG = "mcc_temp_scan";

          // Temperature mux enable line:
          // 74HC4067 E pin is active LOW.
          // E -> PCF8574 IC25 pin 4 = P0.
          // R4 = 10k pull-up to VCC, therefore default PCF 0xFF keeps mux disabled.
          uint8_t pcf_before = 0xFF;
          bool pcf_read_ok = mccdiag::i2c_read_u8(mccdiag::ADDR_PCF8574, pcf_before);
          if (!pcf_read_ok) {
            ESP_LOGE(TAG, "PCF8574 0x27 read failed; cannot enable TC1047 mux");
            return;
          }

          uint8_t pcf_enable = pcf_before & 0xFE;  // P0 LOW, preserve P1..P7.
          bool pcf_enable_ok = mccdiag::i2c_write_u8(mccdiag::ADDR_PCF8574, pcf_enable);
          if (!pcf_enable_ok) {
            ESP_LOGE(TAG, "PCF8574 write enable failed: before=0x%02X enable=0x%02X", pcf_before, pcf_enable);
            return;
          }

          delay(10);

          float temps[16];
          float volts[16];
          float raws[16];
          uint16_t mins[16];
          uint16_t maxs[16];

          constexpr uint8_t samples = 32;
          const float adc_full_scale = ${tc1047_adc_full_scale_v}f;
          const float temp_offset = ${tc1047_temp_offset_c}f;

          for (uint8_t ch = 0; ch < 16; ch++) {
            // Mapping confirmed for C8 and inferred linearly for the same mux:
            // C1-Y0, C2-Y1, ..., C8-Y7, ..., C16-Y15.
            mccdiag::mux_select(ch);
            delay(25);

            uint16_t min_raw = 1023;
            uint16_t max_raw = 0;
            uint32_t sum_raw = 0;

            for (uint8_t i = 0; i < samples; i++) {
              uint16_t raw = analogRead(A0);
              sum_raw += raw;
              if (raw < min_raw) min_raw = raw;
              if (raw > max_raw) max_raw = raw;
              delay(4);
              yield();
            }

            float raw_avg = (float) sum_raw / (float) samples;
            float voltage = raw_avg * (adc_full_scale / 1023.0f);
            float temp_c = ((voltage - 0.500f) * 100.0f) + temp_offset;

            temps[ch] = temp_c;
            volts[ch] = voltage;
            raws[ch] = raw_avg;
            mins[ch] = min_raw;
            maxs[ch] = max_raw;

            ESP_LOGI(TAG,
                     "C%02u/Y%02u TC1047: raw_avg=%.2f min=%u max=%u voltage=%.4fV temp=%.1fC",
                     ch + 1, ch, raw_avg, min_raw, max_raw, voltage, temp_c);
          }

          bool pcf_restore_ok = mccdiag::i2c_write_u8(mccdiag::ADDR_PCF8574, pcf_before);
          if (!pcf_restore_ok) {
            ESP_LOGE(TAG, "PCF8574 restore failed: attempted restore=0x%02X", pcf_before);
          }

          id(c1_tc1047_temperature).publish_state(temps[0]);
          id(c2_tc1047_temperature).publish_state(temps[1]);
          id(c3_tc1047_temperature).publish_state(temps[2]);
          id(c4_tc1047_temperature).publish_state(temps[3]);
          id(c5_tc1047_temperature).publish_state(temps[4]);
          id(c6_tc1047_temperature).publish_state(temps[5]);
          id(c7_tc1047_temperature).publish_state(temps[6]);
          id(c8_tc1047_temperature).publish_state(temps[7]);
          id(c9_tc1047_temperature).publish_state(temps[8]);
          id(c10_tc1047_temperature).publish_state(temps[9]);
          id(c11_tc1047_temperature).publish_state(temps[10]);
          id(c12_tc1047_temperature).publish_state(temps[11]);
          id(c13_tc1047_temperature).publish_state(temps[12]);
          id(c14_tc1047_temperature).publish_state(temps[13]);
          id(c15_tc1047_temperature).publish_state(temps[14]);
          id(c16_tc1047_temperature).publish_state(temps[15]);

          ESP_LOGW(TAG,
                   "TC1047 scan complete: PCF before=0x%02X enable=0x%02X restore=%s ADC_full_scale=%.3fV mapping C1-Y0..C16-Y15",
                   pcf_before, pcf_enable, pcf_restore_ok ? "OK" : "FAIL", adc_full_scale);

interval:
  - interval: ${tc1047_scan_interval}
    then:
      - script.execute: scan_all_tc1047_temperatures

  - interval: 5s
    then:
      - lambda: |-
          id(oled_page) = (id(oled_page) + 1) % 3;

