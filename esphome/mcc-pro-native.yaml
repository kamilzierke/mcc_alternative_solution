substitutions:
  device_name: mcc-pro
  friendly_name: MCC Pro
  tc1047_adc_full_scale_v: "3.02"
  tc1047_temp_offset_c: "0.0"
  external_temp_adc_full_scale_v: "3.02"
  external_temp_offset_c: "0.0"
  ina219_internal_shunt_mohm: "60.0"
  ina219_external_shunt_mohm: "60.0"
  # Calibration rule:
  # tc1047_adc_full_scale_v = V_multimeter_at_mux_Z_or_TC1047_VOUT * 1023 / raw_avg
  # Current value 3.02 comes from: ESPHome 0.8761V vs multimeter 0.801V, after prior 3.30V assumption.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "MegaCell Charger Pro: native ESPHome TCA9548A/PCF8574/i2c_device on-demand per-slot diagnostics."
  includes:
    - mcc_diag_helpers_native.h
  platformio_options:
    build_flags:
      - -DMCC_TC1047_ADC_FULL_SCALE_V=${tc1047_adc_full_scale_v}f
      - -DMCC_TC1047_TEMP_OFFSET_C=${tc1047_temp_offset_c}f
      - -DMCC_EXTERNAL_TEMP_ADC_FULL_SCALE_V=${external_temp_adc_full_scale_v}f
      - -DMCC_EXTERNAL_TEMP_OFFSET_C=${external_temp_offset_c}f
      - -DMCC_INA219_INTERNAL_SHUNT_MOHM=${ina219_internal_shunt_mohm}f
      - -DMCC_INA219_EXTERNAL_SHUNT_MOHM=${ina219_external_shunt_mohm}f
  on_boot:
    priority: 600
    then:
      - lambda: |-
          mccdiag::init_pins();
          mccdiag::setup_bq_web_handler();
          ESP_LOGW("mcc_boot", "MCC native on-demand diagnostics booted. TCA9548A and PCF8574 are handled by ESPHome components. ADC full-scale %.3fV.", ${tc1047_adc_full_scale_v}f);

esp8266:
  board: esp12e
  restore_from_flash: false

logger:
  level: INFO
  baud_rate: 115200

wifi:
  id: mcc_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  min_auth_mode: WPA2

captive_portal:

api:
  id: api_server
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  port: 80
  version: 3
  include_internal: true

# I2C observed on MCC Pro ESP8266 board.
# Expected main-bus devices: 0x27 PCF8574, 0x3C SSD1306, 0x41 INA219 external/U3, 0x4F INA219 internal/U2 or PCA9685, 0x70/0x71 TCA9548A.
# HC4067 enables are driven by helper full-byte PCF8574 writes, one active-low output per mux:
#   P0 LOW -> U10  HC4067, internal TC1047 x16 temperature mux
#   P1 LOW -> U10E HC4067, external temperature x16 mux
#   P2 LOW -> U34  HC4067, raw analog diagnostic mux, exact purpose still being traced
#   P3 LOW -> U3   HC4067, external-cell voltage path into INA219 #1 @ 0x41
#   P4 LOW -> U2   HC4067, internal-slot battery voltage path into INA219 #2 @ 0x4F
i2c:
  - id: main_i2c
    sda: GPIO4
    scl: GPIO5
    scan: false
    frequency: 100kHz
    timeout: 50ms

tca9548a:
  - id: tca0
    address: 0x70
    i2c_id: main_i2c
    channels:
      - bus_id: tca0_ch0
        channel: 0
      - bus_id: tca0_ch1
        channel: 1
      - bus_id: tca0_ch2
        channel: 2
      - bus_id: tca0_ch3
        channel: 3
      - bus_id: tca0_ch4
        channel: 4
      - bus_id: tca0_ch5
        channel: 5
      - bus_id: tca0_ch6
        channel: 6
      - bus_id: tca0_ch7
        channel: 7

  - id: tca1
    address: 0x71
    i2c_id: main_i2c
    channels:
      - bus_id: tca1_ch0
        channel: 0
      - bus_id: tca1_ch1
        channel: 1
      - bus_id: tca1_ch2
        channel: 2
      - bus_id: tca1_ch3
        channel: 3
      - bus_id: tca1_ch4
        channel: 4
      - bus_id: tca1_ch5
        channel: 5
      - bus_id: tca1_ch6
        channel: 6
      - bus_id: tca1_ch7
        channel: 7

pcf8574:
  - id: pcf_mux_ctrl
    i2c_id: main_i2c
    address: 0x27
    pcf8575: false

switch:
  - platform: gpio
    id: tc1047_mux_enable
    name: "Legacy U10 TC1047 Mux Enable P0"
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: pcf_mux_ctrl
      number: 0
      mode:
        output: true
      inverted: true

i2c_device:
  - id: ina_external_u3
    i2c_id: main_i2c
    address: 0x41

  - id: ina_internal_u2
    i2c_id: main_i2c
    address: 0x4F

  # U34 is an HC4067 mux selected by PCF8574 P2 LOW, not an INA219.
  # NOTE: if PCA9685 is also really strapped to 0x4F, it collides with internal INA219 #2.

  - id: bq_c01
    i2c_id: tca0_ch0
    address: 0x6B
  - id: bq_c02
    i2c_id: tca0_ch1
    address: 0x6B
  - id: bq_c03
    i2c_id: tca0_ch2
    address: 0x6B
  - id: bq_c04
    i2c_id: tca0_ch3
    address: 0x6B
  - id: bq_c05
    i2c_id: tca0_ch4
    address: 0x6B
  - id: bq_c06
    i2c_id: tca0_ch5
    address: 0x6B
  - id: bq_c07
    i2c_id: tca0_ch6
    address: 0x6B
  - id: bq_c08
    i2c_id: tca0_ch7
    address: 0x6B

  - id: bq_c09
    i2c_id: tca1_ch0
    address: 0x6B
  - id: bq_c10
    i2c_id: tca1_ch1
    address: 0x6B
  - id: bq_c11
    i2c_id: tca1_ch2
    address: 0x6B
  - id: bq_c12
    i2c_id: tca1_ch3
    address: 0x6B
  - id: bq_c13
    i2c_id: tca1_ch4
    address: 0x6B
  - id: bq_c14
    i2c_id: tca1_ch5
    address: 0x6B
  - id: bq_c15
    i2c_id: tca1_ch6
    address: 0x6B
  - id: bq_c16
    i2c_id: tca1_ch7
    address: 0x6B

globals:
  - id: oled_page
    type: int
    restore_value: false
    initial_value: "0"

  - id: boot_services_ready
    type: bool
    restore_value: false
    initial_value: "false"

interval:
  - interval: 250ms
    startup_delay: 10s
    then:
      - lambda: |-
          mccdiag::process_bq_web_read_request();

  - interval: 10s
    startup_delay: 20s
    then:
      - if:
          condition:
            lambda: |-
              return id(boot_services_ready);
          then:
            - lambda: |-
                mccdiag::queue_auto_poll_all_slots();

  - interval: 2s
    startup_delay: 10s
    then:
      - lambda: |-
          if (!id(boot_services_ready) && id(mcc_wifi).is_connected() && id(api_server).is_connected()) {
            id(boot_services_ready) = true;
            ESP_LOGW("mcc_boot", "WiFi and API are connected; enabling OLED updates. Slot reads are on-demand.");
          }


  - interval: 5s
    startup_delay: 30s
    then:
      - if:
          condition:
            lambda: |-
              return id(boot_services_ready);
          then:
            - lambda: |-
                id(oled_page) = (id(oled_page) + 1) % 3;
            - component.update: oled_display

